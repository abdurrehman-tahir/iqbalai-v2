# IqbalAI OIDC provider + application (T-247, ARCH §6.4).
#
# WHY THIS EXISTS
# `scripts/bootstrap_authentik.py` was a stub — nothing in the repo created the
# Authentik OIDC *application/provider* itself (only end-user accounts, via the
# proven AuthentikClient). Without it, the API's OIDC login (OIDC_ISSUER_URL /
# OIDC_CLIENT_ID / token + jwks endpoints) has nothing to talk to, so the
# `@auth @real` E2E suite can never complete a real code exchange. Authentik
# auto-discovers and applies every blueprint under /blueprints on startup and on
# change, idempotently — so mounting this file makes the OIDC app self-provision
# in a fresh container (local compose + CI) with zero manual steps.
#
# HOW IT MAPS TO CONFIG (must stay in sync with .env.example / api/app/config.py)
#   application slug  = iqbalai            → OIDC_ISSUER_URL .../application/o/iqbalai/
#   client_id         = OIDC_CLIENT_ID     (default iqbalai-api)
#   client_secret     = OIDC_CLIENT_SECRET (dev default; real value per environment)
#   redirect_uri      = the API callback   (ARCH §6.4: the API owns the exchange)
#
# TENANT CLAIMS (why the custom scope mapping below)
# The API routes a login to the school vs independent Postgres schema from the
# JWT (`app/core/tenant.py` get_tenant_type: explicit `tenant_type` claim, else
# `role`). Authentik doesn't know app roles, so the seeded E2E identities carry
# `role`/`tenant_type` in their Authentik user `attributes` (set by
# scripts/seed_e2e_auth_users.py), and this scope mapping copies them into the
# token. Without it the 2 independent-tenant journeys misroute to the school
# schema and fail.
#
# Pinned to the image in docker-compose.yml (goauthentik 2024.12).
# Verified against 2024.12.5: `redirect_uris` MUST be a list of
# `{matching_mode, url}` objects (a bare string fails serializer validation with
# "Expected a list of items but got type str" — which left the blueprint in
# `error` status and meant `/application/o/iqbalai/` 404'd, so @auth @real
# timed out waiting for `input[name="uidField"]`).
# Built-in flow slugs + self-signed cert name are Authentik defaults at init.
version: 1
metadata:
  name: IqbalAI OIDC (provider + application)
  labels:
    blueprints.goauthentik.io/instantiate: "true"

entries:
  # 0. Apply default/system blueprints FIRST. Authentik discovery dispatches
  #    apply_blueprint concurrently with no ordering (goauthentik/authentik#19715);
  #    without this, our !Find for flows / managed OAuth2 scopes races and the
  #    instance lands in status=error — CI then 404s on
  #    /application/o/iqbalai/.well-known/openid-configuration for the full
  #    wait budget. metaapplyblueprint forces the deps to exist before we resolve.
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Default - Authentication flow
      required: true
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Default - Provider authorization flow (implicit consent)
      required: true
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Default - Provider invalidation flow
      required: true
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: System - OAuth2 Provider - Scopes
      required: true

  # 1. Custom scope mapping — copies role + tenant_type + org scope from the
  #    user's Authentik attributes into the id_token/userinfo so the API can
  #    route the tenant and enforce district/school scope (ARCH §3.16/§6.4/§6.7).
  - id: iqbalai-claims-mapping
    model: authentik_providers_oauth2.scopemapping
    identifiers:
      name: "IqbalAI Claims (role + tenant_type)"
    attrs:
      scope_name: iqbalai
      description: "IqbalAI role + tenant_type + district/school claims (ARCH §3.16/§6.4/§6.7)."
      expression: |
        claims = {
            "role": request.user.attributes.get("role", ""),
            "tenant_type": request.user.attributes.get("tenant_type", "school"),
        }
        # Only emit org-scope keys when present. Emitting null would make
        # "district_id" in claims True and the login reconciler would wipe a
        # correctly seeded Postgres district_id/school_id/scoped_ids.
        district_id = request.user.attributes.get("district_id")
        school_id = request.user.attributes.get("school_id")
        scoped_ids = request.user.attributes.get("scoped_ids")
        if district_id:
            claims["district_id"] = district_id
        if school_id:
            claims["school_id"] = school_id
        if scoped_ids:
            claims["scoped_ids"] = scoped_ids
        return claims

  # 2. OAuth2 / OIDC provider — the confidential client the API uses.
  - id: iqbalai-api-provider
    model: authentik_providers_oauth2.oauth2provider
    identifiers:
      name: iqbalai-api
    attrs:
      client_type: confidential
      client_id: !Env [OIDC_CLIENT_ID, iqbalai-api]
      client_secret: !Env [OIDC_CLIENT_SECRET, change_me_after_authentik_bootstrap]
      # ARCH §6.4: the API (not the browser) performs the code+PKCE exchange, so
      # the only redirect target is the API's own callback route.
      # 2024.12 serializer: list of RedirectURI objects (not a bare string).
      redirect_uris:
        - matching_mode: strict
          url: !Env [OIDC_REDIRECT_URI, "http://localhost:8000/api/v1/auth/callback"]
      # sub = a stable per-user id → used as the app-DB authentik_id.
      sub_mode: hashed_user_id
      include_claims_in_id_token: true
      # ARCH §6.5: ES256 primary / RS256 fallback. The self-signed cert Authentik
      # generates at init is RS256, which the API accepts (algorithms ES256+RS256).
      signing_key:
        !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      authentication_flow:
        !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      authorization_flow:
        !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      property_mappings:
        - !Find [
            authentik_providers_oauth2.scopemapping,
            [managed, "goauthentik.io/providers/oauth2/scope-openid"],
          ]
        - !Find [
            authentik_providers_oauth2.scopemapping,
            [managed, "goauthentik.io/providers/oauth2/scope-email"],
          ]
        - !Find [
            authentik_providers_oauth2.scopemapping,
            [managed, "goauthentik.io/providers/oauth2/scope-profile"],
          ]
        - !KeyOf iqbalai-claims-mapping

  # 3. Application — slug drives OIDC_ISSUER_URL (.../application/o/iqbalai/).
  - id: iqbalai-application
    model: authentik_core.application
    identifiers:
      slug: iqbalai
    attrs:
      name: IqbalAI
      provider: !KeyOf iqbalai-api-provider
      # User-portal "Launch" tile — open the Next app, not the API (API / returns
      # AUTHENTICATION_REQUIRED JSON). Real login still starts at /login → API
      # /auth/login (ARCH §6.4); this URL is only for the Authentik my-apps click.
      meta_launch_url: !Env [APP_URL, "http://localhost:3000"]
