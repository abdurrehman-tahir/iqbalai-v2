# Single-binary Loki for local docker compose (target=all).
# Fixes ratestore "unable to get stream rates from ingester" DeadlineExceeded
# when the default image config is too aggressive on a busy dev machine.

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9095
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

# Distributor → ingester RPC (stream rates for ingestion limits)
ingester_client:
  remote_timeout: 30s

limits_config:
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  # Avoid sharding rate-store polls on a single-process dev deployment
  shard_streams:
    enabled: false
  ingestion_rate_mb: 32
  ingestion_burst_size_mb: 64

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

analytics:
  reporting_enabled: false
