global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "iqbalai-api"
    static_configs:
      - targets: ["api:8000"]
    metrics_path: /metrics

  - job_name: "iqbalai-celery"
    static_configs:
      - targets: ["celery-worker:9808"]

  - job_name: "nats"
    static_configs:
      - targets: ["nats:8222"]
    metrics_path: /metrics

  - job_name: "qdrant"
    static_configs:
      - targets: ["qdrant:6333"]
    metrics_path: /metrics

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
