[project]
name = "iqbalai-api"
version = "0.1.0"
description = "IqbalAI v2 FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "httpx>=0.27.0",
    "openai>=1.0.0",
    "qdrant-client>=1.9.0",
    "structlog>=24.2.0",
    "python-jose[cryptography]>=3.3.0",
    "celery[redis]>=5.3.0",
    "nats-py>=2.6.0",
    "boto3>=1.34.0",
    "prometheus-fastapi-instrumentator>=0.9.0",
    "python-multipart>=0.0.9",
    # T-024 — Platform Library ingestion pipeline
    "pdfplumber>=0.11.0",                # PDF text extraction (lightweight fallback per STACK_LOCK §4.3)
    "langchain-text-splitters>=0.3.0",   # RecursiveCharacterTextSplitter (pre-approved deviation §7.7)
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "mypy==1.11.2",
    "ruff==0.6.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
strict = true
python_version = "3.12"

[[tool.mypy.overrides]]
# qdrant-client stubs don't expose AsyncQdrantClient.search() but it exists at runtime.
# warn_unused_ignores is suppressed here so the # type: ignore[attr-defined] on that
# call doesn't cause a false "unused" error in envs where qdrant-client isn't installed.
module = "app.infrastructure.rag.retriever"
warn_unused_ignores = false

[[tool.mypy.overrides]]
# openai's create() messages param + streaming union-attr need type: ignore when openai
# is installed (CI), but those ignores appear unused locally (no openai in dev venv).
module = "app.infrastructure.llm.client"
warn_unused_ignores = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "app"]
