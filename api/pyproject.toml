[project]
name = "iqbalai-api"
version = "0.1.0"
description = "IqbalAI v2 FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "httpx>=0.27.0",
    "openai>=1.0.0",
    "qdrant-client>=1.9.0",
    "structlog>=24.2.0",
    "python-jose[cryptography]>=3.3.0",
    "celery[redis]>=5.3.0",
    "nats-py>=2.6.0",
    "boto3>=1.34.0",
    "prometheus-fastapi-instrumentator>=0.9.0",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
