[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = space

# Dual-head version locations (space-separated; see version_path_separator)
version_locations = %(here)s/alembic/versions/school %(here)s/alembic/versions/independent

# DB URL is overridden by env.py reading DB_URL env var
sqlalchemy.url = postgresql+asyncpg://iqbalai:iqbalai@localhost:5432/iqbalai

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
