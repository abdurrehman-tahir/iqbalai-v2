name: pr-template-check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [staging, main]

permissions:
  pull-requests: read

jobs:
  check:
    name: PR template completeness
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check required sections are filled
        uses: actions/github-script@v7
        with:
          script: |
            // Fetch live PR body — synchronize webhooks can omit or alter body vs REST.
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });
            const body = (pr.body || "")
              // GitHub linkifies @mentions: [@user](url) → @user for header matching.
              .replace(/\[(@[\w-]+)\]\([^)]+\)/g, "$1");

            // Required headers with non-empty content under them.
            // "Milestone & feature reference" replaced legacy "Phase & feature reference"
            // (see PULL_REQUEST_TEMPLATE.md + BRANCHING.md milestone rename, 2026-05-29).
            const requiredSections = [
              { name: "Summary", header: "## Summary" },
              { name: "Type", header: "## Type" },
              {
                name: "Milestone & feature reference",
                header: "## Milestone & feature reference",
                altHeader: "## Phase & feature reference",
              },
              { name: "Stack compliance", header: "## Stack compliance" },
              { name: "Testing", header: "## Testing" },
              {
                name: "Open questions for @abdurrehman",
                header: "## Open questions for @abdurrehman",
                altHeader: "## Open questions for @abdurrehman-tahir",
              },
            ];

            const missing = [];
            const empty = [];

            for (const section of requiredSections) {
              let idx = body.indexOf(section.header);
              if (idx === -1 && section.altHeader) {
                idx = body.indexOf(section.altHeader);
              }
              if (idx === -1) {
                missing.push(section.name);
                continue;
              }
              const matchedHeader =
                body.slice(idx).startsWith(section.header) ? section.header : section.altHeader;
              // Find next ## header or end of body
              const rest = body.slice(idx + matchedHeader.length);
              const nextHeader = rest.search(/\n##\s/);
              const content = (nextHeader === -1 ? rest : rest.slice(0, nextHeader))
                .replace(/<!--[\s\S]*?-->/g, "")
                .trim();

              if (!content || content.length < 5) {
                empty.push(section.name);
              }
            }

            if (missing.length || empty.length) {
              let msg = "❌ PR template incomplete.\n";
              if (missing.length) msg += `\nMissing sections: ${missing.join(", ")}`;
              if (empty.length) msg += `\nEmpty sections: ${empty.join(", ")}`;
              msg += "\n\nFill all required sections in the PR description, then push or update to re-trigger this check.";
              core.setFailed(msg);
            } else {
              console.log("✅ All required PR template sections are filled.");
            }

      - name: Check exactly one "Type" checkbox is ticked
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });
            // Strip HTML comments so example/commented checkboxes never count.
            const body = (pr.body || "")
              .replace(/<!--[\s\S]*?-->/g, "");

            // Only inspect the "## Type" section, so ticked checkboxes in other
            // sections (e.g. "- [x] Tests pass locally" under Testing) are never
            // miscounted as a PR type. Bug fixed: previously the regex scanned the
            // whole body, was case-insensitive, and had no word boundary, so
            // "- [x] Tests..." matched "test" and produced false "multiple types".
            const typeIdx = body.indexOf("## Type");
            let typeSection = "";
            if (typeIdx !== -1) {
              const rest = body.slice(typeIdx + "## Type".length);
              const nextHeader = rest.search(/\n##\s/);
              typeSection = nextHeader === -1 ? rest : rest.slice(0, nextHeader);
            }

            // Match only real ticked type boxes: line-anchored, exact label,
            // word-boundary terminated. Case-insensitive on the marker only.
            const tickedTypes = (typeSection.match(
              /^\s*-\s\[x\]\s(feat|fix|chore|docs|refactor|test|perf|deviation|release)\b/gim
            ) || []);

            if (tickedTypes.length === 0) {
              core.setFailed("❌ No PR type checked. Tick exactly one box under '## Type'.");
            } else if (tickedTypes.length > 1) {
              core.setFailed(`❌ Multiple PR types checked (${tickedTypes.length}). Tick exactly one.`);
            } else {
              console.log(`✅ PR type: ${tickedTypes[0].trim()}`);
            }