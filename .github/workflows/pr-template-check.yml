name: PR Template Check

on:
  pull_request:
    branches: [staging, main]

jobs:
  check-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required PR template sections
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            const required = ['## Summary', '## Type', '## Stack compliance', '## Checklist'];
            const missing = required.filter(s => !body.includes(s));
            if (missing.length > 0) {
              core.setFailed(`PR is missing required sections: ${missing.join(', ')}. Use the PR template.`);
            } else {
              console.log('PR template check passed.');
            }
