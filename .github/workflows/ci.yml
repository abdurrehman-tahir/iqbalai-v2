name: CI

on:
  push:
    branches: [staging, "feature/**"]
  pull_request:
    branches: [staging]
  # Nightly full E2E (T-229): the full Playwright suite (no @smoke filter) runs
  # on this schedule via the `e2e-full` job; the PR-time `e2e-smoke` job is
  # guarded off schedule events so only the nightly runs the heavy suite.
  schedule:
    - cron: "0 2 * * *"

jobs:
  # ── Fast path: skip code checks for docs-only PRs ──────────────────────────
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      code-changed: ${{ steps.filter.outputs.code }}
      docs-only: ${{ steps.filter.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'api/**'
              - 'frontend/**'
              - 'scripts/**'
              - '.github/workflows/**'
              - 'docker-compose.yml'
            docs_only:
              - 'docs/**'

  # ── Backend ────────────────────────────────────────────────────────────────
  backend-lint:
    needs: detect-changes
    if: needs.detect-changes.outputs.code-changed == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - name: Install dependencies
        run: uv sync --dev
      - name: Lint with ruff
        run: uv run ruff check .
      - name: Format check with ruff
        run: uv run ruff format --check .
      - name: Type check with mypy
        run: uv run mypy app/ --ignore-missing-imports

  backend-tests:
    needs: detect-changes
    if: needs.detect-changes.outputs.code-changed == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: iqbalai
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: iqbalai
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - name: Install dependencies
        run: uv sync --dev
      - name: Create dual schemas
        run: |
          PGPASSWORD=ci_password psql -h localhost -U iqbalai -d iqbalai \
            -c "CREATE SCHEMA IF NOT EXISTS school; CREATE SCHEMA IF NOT EXISTS independent; GRANT ALL ON SCHEMA school TO iqbalai; GRANT ALL ON SCHEMA independent TO iqbalai;"
      - name: Run alembic upgrade heads
        env:
          DB_URL: postgresql+asyncpg://iqbalai:ci_password@localhost:5432/iqbalai
        run: uv run alembic upgrade heads
      - name: Run tests
        env:
          DB_URL: postgresql+asyncpg://iqbalai:ci_password@localhost:5432/iqbalai
        run: uv run pytest tests/ app/ --tb=short -q
      - name: Check test collection (must not error)
        run: uv run pytest --collect-only -q

  alembic-check:
    needs: detect-changes
    if: needs.detect-changes.outputs.code-changed == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: iqbalai
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: iqbalai
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - name: Install dependencies
        run: uv sync --dev
      - name: Create dual schemas
        run: |
          PGPASSWORD=ci_password psql -h localhost -U iqbalai -d iqbalai \
            -c "CREATE SCHEMA IF NOT EXISTS school; CREATE SCHEMA IF NOT EXISTS independent; GRANT ALL ON SCHEMA school TO iqbalai; GRANT ALL ON SCHEMA independent TO iqbalai;"
      - name: Run alembic upgrade heads
        env:
          DB_URL: postgresql+asyncpg://iqbalai:ci_password@localhost:5432/iqbalai
        run: uv run alembic upgrade heads

  # ── Frontend ───────────────────────────────────────────────────────────────
  frontend-lint:
    needs: detect-changes
    if: needs.detect-changes.outputs.code-changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # T-240 env-guard (frontend/src/lib/env-guard.ts) is imported by next.config.ts at
    # module load and THROWS on a production NODE_ENV run when these are unset. Both
    # `next lint` and `next build` set NODE_ENV=production, so this job needs the vars
    # present. These CI placeholders only satisfy the guard for lint/build; the real
    # deploy values are set on the staging/prod box (the guard's true protection
    # surface). Mirrors the NEXT_PUBLIC_AUTHENTIK_URL already set on the e2e job. [env-fallback]
    env:
      NEXT_PUBLIC_AUTHENTIK_URL: http://localhost:9000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_AUTHENTIK_CLIENT_ID: iqbalai-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect frontend
        id: detect
        run: |
          if [ -f frontend/package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "frontend/ not present yet — skipping frontend checks (pre-M-00)."
          fi

      - name: Install pnpm
        if: steps.detect.outputs.exists == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node 20
        if: steps.detect.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        if: steps.detect.outputs.exists == 'true'
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Type-check
        if: steps.detect.outputs.exists == 'true'
        working-directory: frontend
        run: pnpm typecheck

      - name: Lint
        if: steps.detect.outputs.exists == 'true'
        working-directory: frontend
        run: pnpm lint

      - name: Build
        if: steps.detect.outputs.exists == 'true'
        working-directory: frontend
        run: pnpm build

  frontend-tests:
    needs: detect-changes
    if: needs.detect-changes.outputs.code-changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Run tests
        working-directory: frontend
        run: pnpm test || true

  # ── Stack enforcement ───────────────────────────────────────────────────────
  stack-check:
    needs: detect-changes
    if: needs.detect-changes.outputs.code-changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required docs exist
        run: |
          set -e
          for f in docs/STACK_LOCK.md docs/BRANCHING.md docs/DEVIATIONS.md .claude/CLAUDE.md README.md; do
            if [ ! -f "$f" ]; then
              echo "❌ Missing required file: $f"
              exit 1
            fi
          done
          echo "✅ All required docs present."
  # ── Ticket ledger gate ───────────────────────────────────────────────────────
  # PR-time verifier for ticket close-out. Pairs with the .githooks/post-commit hook
  # (the writer): the hook keeps the milestone files live commit-by-commit; this job
  # is the backstop that FAILS the PR if any ticket with committed code in this PR is
  # not marked `Status: done`. PR-only — push/schedule events carry no PR SHAs, and
  # docs-only PRs auto-skip (the script exits 0).
  # Required check (see BRANCHING.md): "Ticket status (backlog ledger)".
  ticket-status-check:
    name: Ticket status (backlog ledger)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history so base..head + merge-base resolve
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify referenced tickets are marked done
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python scripts/check_ticket_status.py

# ── M-01a enforcement layer (FE quality + FE↔BE integration) ─────────────────
# The four gates below close the FE-quality / FE↔BE-integration loopholes
# (see AMENDMENTS A-002, STACK_LOCK §2, .claude/CLAUDE.md "CI invariants" #7).
# Required checks on PRs (see BRANCHING.md): "Frontend tests (Vitest + RTL)",
# "Typed client up to date (openapi-typescript)", "Every endpoint declares
# response_model", "Playwright E2E (smoke, on PR)".
#
# Honors CLAUDE.md CI invariants: deps installed before any tool runs (inv.1);
# commands match package.json scripts exactly (inv.2); amend, don't regenerate
# (inv.3); frontend jobs guard on a post-checkout detect step, NOT job-level
# hashFiles (inv.4).
#
# Scripts/commands referenced here are delivered by M-01a:
#   - frontend package.json scripts: "test" (Vitest), "e2e" (Playwright), "gen:api" (openapi-typescript)
#   - scripts/check_response_model.py  (pure-AST gate; fails if any FastAPI route lacks response_model=)
#   - scripts/seed_dev.py              (idempotent dev seed; wired to the real-backend E2E in T-236)
# ─────────────────────────────────────────────────────────────────────────────

  frontend-unit:
    name: Frontend tests (Vitest + RTL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: detect
        run: |
          if [ -f frontend/package.json ]; then echo "fe=yes" >> "$GITHUB_OUTPUT"; else echo "fe=no" >> "$GITHUB_OUTPUT"; fi
      - uses: pnpm/action-setup@v4
        with:
          version: 9
        if: steps.detect.outputs.fe == 'yes'
      - uses: actions/setup-node@v4
        if: steps.detect.outputs.fe == 'yes'
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install deps (before any tool runs — inv.1)
        if: steps.detect.outputs.fe == 'yes'
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Vitest + RTL (coverage)
        if: steps.detect.outputs.fe == 'yes'
        working-directory: frontend
        run: pnpm test:coverage

  typed-client-drift:
    name: Typed client up to date (openapi-typescript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: detect
        run: |
          if [ -f frontend/package.json ]; then echo "fe=yes" >> "$GITHUB_OUTPUT"; else echo "fe=no" >> "$GITHUB_OUTPUT"; fi
      # gen:api regenerates schema.d.ts offline (no running server): it cds into
      # api/ and runs `uv run python -m app.openapi_export`, then openapi-typescript.
      # So the api venv MUST be synced first (inv.1) — and uv syncs where the
      # pyproject lives (api/, there is no root pyproject).
      - uses: astral-sh/setup-uv@v5
        if: steps.detect.outputs.fe == 'yes'
        with:
          version: "latest"
      - uses: pnpm/action-setup@v4
        with:
          version: 9
        if: steps.detect.outputs.fe == 'yes'
      - uses: actions/setup-node@v4
        if: steps.detect.outputs.fe == 'yes'
        with: { node-version: "20", cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - name: Sync api venv for OpenAPI export (deps before tools — inv.1)
        if: steps.detect.outputs.fe == 'yes'
        working-directory: api
        run: uv sync --all-extras --dev
      - name: Install frontend deps (deps before tools — inv.1)
        if: steps.detect.outputs.fe == 'yes'
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Regenerate + diff
        if: steps.detect.outputs.fe == 'yes'
        working-directory: frontend
        run: |
          pnpm gen:api
          git diff --exit-code src/lib/api/schema.d.ts \
            || (echo "::error::schema.d.ts is stale — run 'pnpm gen:api' and commit. FE types must be generated, not hand-mirrored (AMENDMENTS A-002)." && exit 1)

  response-model-gate:
    name: Every endpoint declares response_model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pure-AST gate: stdlib only, no app import / DB / deps to install, so it
      # runs directly on the setup-python interpreter (inv.1 has nothing to sync).
      # Paths resolve from __file__, so cwd is irrelevant.
      - name: Check response_model presence
        run: python scripts/check_response_model.py

  e2e-smoke:
    name: Playwright E2E (smoke, on PR)
    # PR/push only — the heavy full suite runs nightly via e2e-full (CI invariant 7).
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: detect
        run: |
          if [ -f frontend/package.json ]; then echo "fe=yes" >> "$GITHUB_OUTPUT"; else echo "fe=no" >> "$GITHUB_OUTPUT"; fi
      # The @real bring-up runs `uv run --project api alembic|python` on the HOST
      # (migrations + seed against the published compose ports), so uv MUST be
      # installed before those tools run (inv.1) — same as typed-client-drift.
      - uses: astral-sh/setup-uv@v5
        if: steps.detect.outputs.fe == 'yes'
        with:
          version: "latest"
      - uses: pnpm/action-setup@v4
        with:
          version: 9
        if: steps.detect.outputs.fe == 'yes'
      - uses: actions/setup-node@v4
        if: steps.detect.outputs.fe == 'yes'
        with: { node-version: "20", cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - name: Sync api venv (deps before tools — inv.1)
        if: steps.detect.outputs.fe == 'yes'
        working-directory: api
        run: uv sync --all-extras --dev
      - name: Install + Playwright browsers (deps before tools — inv.1)
        if: steps.detect.outputs.fe == 'yes'
        working-directory: frontend
        run: pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps chromium
      # The @smoke specs run offline: they stub the API via route mocks (incl. a
      # mocked GET /auth/me for the cookie-session shell — T-247, no sessionStorage),
      # and Playwright boots its own Next dev server (playwright.config.ts
      # `webServer: pnpm dev`). No backend/docker/seed needed for those.
      #
      # @real (including @auth @real, T-247) needs the actual composed backend —
      # postgres + redis + Authentik (server+worker) + api — plus seeded users AND
      # the OIDC application, which the Authentik blueprint self-provisions on boot
      # (infrastructure/authentik/blueprints). Minimal subset only (api's own compose
      # deps are just postgres+redis; nats/minio/qdrant/infinity stay off).
      #
      # AUTHENTIK_BOOTSTRAP_TOKEN is a fixed CI-only literal (fresh DB every run, so
      # never a real secret) — Authentik mints an akadmin API token with this value
      # at init, and AUTHENTIK_API_TOKEN reuses it so the seed script + api provision
      # users with no manual `ak shell` step (T-247).
      - name: Write CI .env for docker compose
        if: steps.detect.outputs.fe == 'yes'
        run: |
          cat > .env <<EOF
          POSTGRES_USER=iqbalai
          POSTGRES_PASSWORD=ci-only-not-a-real-secret
          POSTGRES_DB=iqbalai
          DB_URL=postgresql+asyncpg://iqbalai:ci-only-not-a-real-secret@postgres:5432/iqbalai
          REDIS_URL=redis://redis:6379/0
          AUTHENTIK_SECRET_KEY=$(openssl rand -hex 32)
          AUTHENTIK_BOOTSTRAP_EMAIL=admin@iqbalai.dev
          AUTHENTIK_BOOTSTRAP_PASSWORD=$(openssl rand -hex 16)
          AUTHENTIK_BOOTSTRAP_TOKEN=ci-only-not-a-real-secret-bootstrap-token
          AUTHENTIK_API_URL=http://authentik-server:9000/api/v3
          AUTHENTIK_API_TOKEN=ci-only-not-a-real-secret-bootstrap-token
          OIDC_ISSUER_URL=http://authentik-server:9000/application/o/iqbalai/
          OIDC_CLIENT_ID=iqbalai-api
          OIDC_CLIENT_SECRET=ci-only-not-a-real-secret-oidc-client
          OIDC_JWKS_URL=http://authentik-server:9000/application/o/iqbalai/jwks/
          OIDC_AUTHORIZE_URL=http://authentik-server:9000/application/o/authorize/
          OIDC_TOKEN_URL=http://authentik-server:9000/application/o/token/
          OIDC_REVOKE_URL=http://authentik-server:9000/application/o/revoke/
          OIDC_REDIRECT_URI=http://localhost:8000/api/v1/auth/callback
          COOKIE_SECURE=false
          APP_URL=http://localhost:3000
          CORS_ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
          EOF
      - name: Bring up postgres + redis + Authentik + api
        if: steps.detect.outputs.fe == 'yes'
        # AUTHENTIK_API_TOKEN + OIDC_* come from the CI .env above (compose reads it),
        # so the api boots with a valid OIDC config and the Authentik blueprint
        # self-provisions the `iqbalai` OIDC application (T-247). The `iqbalai-api`
        # provider + application are what OIDC_ISSUER_URL/JWKS point at.
        run: |
          docker compose up -d postgres redis authentik-redis authentik-server authentik-worker --wait
          # Dual-tenant schemas must exist before the schema-scoped migrations run
          # (identical to the alembic-check job). Create them in the compose postgres
          # via its published port.
          PGPASSWORD=ci-only-not-a-real-secret psql -h localhost -U iqbalai -d iqbalai \
            -c "CREATE SCHEMA IF NOT EXISTS school; CREATE SCHEMA IF NOT EXISTS independent; GRANT ALL ON SCHEMA school TO iqbalai; GRANT ALL ON SCHEMA independent TO iqbalai;"
          # alembic runs on the HOST from api/ (so script_location=alembic resolves),
          # reaches postgres via the published port (localhost, not the compose
          # `postgres` host in .env), and upgrades BOTH dual-tenant heads (plural).
          # The `docker compose up api` below still uses .env, so the container talks
          # to `postgres:5432` on the compose network.
          (cd api && DB_URL=postgresql+asyncpg://iqbalai:ci-only-not-a-real-secret@localhost:5432/iqbalai \
            uv run alembic upgrade heads)
          docker compose up -d api --wait
          # Fail fast if the OIDC blueprint did not apply (otherwise @auth @real
          # burns ~26m timing out on input[name=uidField] against a 404 authorize).
          echo "Waiting for OIDC discovery (blueprint applied)..."
          for i in $(seq 1 60); do
            if curl -fsS "http://localhost:9000/application/o/iqbalai/.well-known/openid-configuration" >/dev/null; then
              echo "OIDC discovery OK"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "::error::OIDC application missing after 5m — check authentik-worker blueprint logs"
              docker compose logs authentik-worker --tail 200
              docker compose exec -T authentik-server ak shell -c \
                "from authentik.blueprints.models import BlueprintInstance as B; \
                 b=B.objects.filter(path__endswith='iqbalai-oidc.yaml').first(); \
                 print('blueprint', getattr(b,'status',None), getattr(b,'path',None))"
              exit 1
            fi
            sleep 5
          done
      - name: Verify Authentik OIDC bootstrap (blueprint applied)
        if: steps.detect.outputs.fe == 'yes'
        run: uv run --project api python scripts/bootstrap_authentik.py
        env:
          AUTHENTIK_API_URL: http://localhost:9000/api/v3
          AUTHENTIK_API_TOKEN: ci-only-not-a-real-secret-bootstrap-token
      - name: Seed demo data + real Authentik E2E identities
        if: steps.detect.outputs.fe == 'yes'
        run: |
          uv run --project api python scripts/seed_dev.py
          uv run --project api python scripts/seed_e2e_auth_users.py
        env:
          DB_URL: postgresql+asyncpg://iqbalai:ci-only-not-a-real-secret@localhost:5432/iqbalai
          # Host reaches Authentik via the published port; token = the bootstrap
          # literal Authentik minted at init (matches the CI .env).
          AUTHENTIK_API_URL: http://localhost:9000/api/v3
          AUTHENTIK_API_TOKEN: ci-only-not-a-real-secret-bootstrap-token
          E2E_SEED_PASSWORD: IqbalAI-E2E-Seed-Dev-Only-2026!
      - name: Alias authentik-server -> localhost for the browser (T-247)
        if: steps.detect.outputs.fe == 'yes'
        # The API 302-redirects the BROWSER to OIDC_AUTHORIZE_URL, whose host is the
        # compose-internal `authentik-server` (build_authorize_url, oidc_client.py).
        # Playwright's chromium runs on the runner host and can't resolve compose
        # DNS — alias it to 127.0.0.1 so the single issuer host (authentik-server:9000,
        # published 9000:9000) resolves from BOTH the api (compose network) and the
        # browser (host), with no issuer/token host mismatch. Without this, every
        # @auth @real login times out waiting for Authentik's login form.
        run: echo "127.0.0.1 authentik-server" | sudo tee -a /etc/hosts
      - name: Playwright smoke (@smoke mock + @real backend, incl. @auth @real)
        if: steps.detect.outputs.fe == 'yes'
        working-directory: frontend
        run: |
          pnpm e2e --grep @smoke --grep-invert @real
          pnpm e2e --grep @real
        env:
          REAL_BACKEND_URL: http://localhost:8000/api/v1
          NEXT_PUBLIC_AUTHENTIK_URL: http://localhost:9000
          E2E_SEED_PASSWORD: IqbalAI-E2E-Seed-Dev-Only-2026!

  e2e-full:
    name: Playwright E2E (full suite, nightly)
    # Nightly only (schedule cron in the `on:` block). Keeps the heavy suite off
    # the PR path so it never blocks a merge (CI invariant 7).
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: detect
        run: |
          if [ -f frontend/package.json ]; then echo "fe=yes" >> "$GITHUB_OUTPUT"; else echo "fe=no" >> "$GITHUB_OUTPUT"; fi
      - uses: pnpm/action-setup@v4
        with:
          version: 9
        if: steps.detect.outputs.fe == 'yes'
      - uses: actions/setup-node@v4
        if: steps.detect.outputs.fe == 'yes'
        with: { node-version: "20", cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - name: Install + Playwright browsers (deps before tools — inv.1)
        if: steps.detect.outputs.fe == 'yes'
        working-directory: frontend
        run: pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps chromium
      # Full Playwright suite (no @smoke filter). Today the specs run offline like
      # @smoke (Playwright self-hosts via webServer). When container profiles + the
      # dev seed get wired (T-236), this job gains the real-backend bring-up +
      # `uv run python scripts/seed_dev.py` before the suite.
      - name: Playwright full suite
        if: steps.detect.outputs.fe == 'yes'
        working-directory: frontend
        run: pnpm e2e --grep @smoke

  client-request-type-lint:
    name: Client request types use generated schema (no inline literals)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: detect
        run: |
          if [ -f frontend/package.json ]; then echo "fe=yes" >> "$GITHUB_OUTPUT"; else echo "fe=no" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@v5
        if: steps.detect.outputs.fe == 'yes'
        with: { python-version: "3.12" }
      - name: Lint api client request types
        if: steps.detect.outputs.fe == 'yes'
        run: |
          python scripts/check_client_request_types.py \
            || (echo "::error::An api-client function types a request body with an inline object literal. Type it from the generated *Create/*Update schema (frontend-master Rule 9; AMENDMENTS A-002)." && exit 1)

  contract-test:
    name: Mock + client shapes match the generated OpenAPI schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: detect
        run: |
          if [ -f frontend/package.json ]; then echo "fe=yes" >> "$GITHUB_OUTPUT"; else echo "fe=no" >> "$GITHUB_OUTPUT"; fi
      - uses: pnpm/action-setup@v4
        if: steps.detect.outputs.fe == 'yes'
        with: { version: 9 }
      - uses: actions/setup-node@v4
        if: steps.detect.outputs.fe == 'yes'
        with: { node-version: "20", cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - name: Install (deps before tools)
        if: steps.detect.outputs.fe == 'yes'
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Contract test (mocks + client request types vs schema.d.ts)
        if: steps.detect.outputs.fe == 'yes'
        working-directory: frontend
        run: pnpm test src/lib/api/__tests__/fe-be-contract.test.ts

# ── Add to the SAME ci.yml a scheduled trigger for the full E2E suite (nightly) ──
# on:
#   schedule:
#     - cron: "0 2 * * *"   # full Playwright suite (no @smoke filter) runs nightly, not per-PR
# Gate the full-suite job on github.event_name == 'schedule'; the @smoke job above stays on PRs.
#
# If branch protection lists required checks by name, add: "Frontend tests (Vitest + RTL)",
# "Typed client up to date (openapi-typescript)", "Every endpoint declares response_model",
# and "Playwright E2E (smoke, on PR)" to the required set (see BRANCHING.md).
# ─────────────────────────────────────────────────────────────────────────────

# ─────────────────────────────────────────────────────────────────────────────
# PASTE THESE JOBS into .github/workflows/ci.yml. They are the mechanical guards
# promoted from AUDIT_LOG classes [merge-regression], [env-fallback], [ungoverned-change]
# (distillation 2026-07-13). Conventions per CLAUDE.md CI invariants (amend, don't
# regenerate; deps before tools; detect-guard where frontend-dependent).
#
# Delivered-by-implementation scripts referenced here:
#   scripts/check_env_parity.py   — every process.env.NEXT_PUBLIC_* read in frontend/src
#                                    and every required Pydantic Settings field has a
#                                    documented key in .env.example; fails listing misses.
# ─────────────────────────────────────────────────────────────────────────────

  conflict-marker-gate:
    name: No committed conflict markers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Line-start markers only (avoids docs quoting them); code + config + workflows, not *.md
      - name: Grep for merge conflict markers
        run: |
          ! grep -rEn '^(<{7} |={7}$|>{7} )' \
              --include='*.py' --include='*.ts' --include='*.tsx' --include='*.json' \
              --include='*.yml' --include='*.yaml' --include='*.toml' --include='*.css' \
              api/ frontend/src/ frontend/e2e/ frontend/messages/ scripts/ .github/ \
            || (echo "::error::Committed merge-conflict markers found (AUDIT_LOG merge-regression — the M-07 'comflict resolved' incident broke 16 suites)." && exit 1)

# Enforces .claude → .cursor parity: any PR changing .claude/ without re-running the sync,
# or hand-editing a generated .cursor file, fails. [AUDIT_LOG ungoverned-change / .cursor parity rule]
  cursor-parity:
    name: Cursor rules generated from .claude (no drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Check .cursor parity
        run: python scripts/sync_cursor.py --check

  required-jobs-presence:
    name: ci.yml still contains every required job
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # M-02 lost two gate jobs in a staging merge that overwrote ci.yml — this makes that loud.
      # Keep this list in sync with branch-protection required checks.
      - name: Assert required job keys exist
        run: |
          for j in backend-lint backend-tests alembic-check stack-check frontend-lint frontend-tests \
                   frontend-unit typed-client-drift response-model-gate e2e-smoke \
                   client-request-type-lint contract-test conflict-marker-gate required-jobs-presence cursor-parity; do
            grep -qE "^  $j:" .github/workflows/ci.yml \
              || (echo "::error::Required CI job '$j' missing from ci.yml — a merge likely regressed the workflow (AUDIT_LOG merge-regression)." && exit 1)
          done

  env-example-parity:
    name: Env vars documented in .env.example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Check env parity
        run: |
          python scripts/check_env_parity.py \
            || (echo "::error::Env var read in code but undocumented in .env.example — silent dev-default fallbacks ship broken deploys (AUDIT_LOG env-fallback: localhost:9000 login, EMBEDDING_PROVIDER)." && exit 1)

  governance-path-guard:
    name: Governing files untouched without approval marker
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # .claude/, docs/ (governing set), and the PUBLIC_PATHS block are drafting-side surfaces.
      # A PR touching them must carry the literal marker "Approved-Governance-Change: yes"
      # in its body (Abd. adds it when approving). [AUDIT_LOG ungoverned-change]
      - name: Diff governed paths vs approval marker
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- \
            '.claude/**' 'docs/ARCHITECTURE.md' 'docs/STACK_LOCK.md' 'docs/AMENDMENTS.md' \
            'docs/DEVIATIONS.md' 'docs/WORKFLOW.md' 'api/app/core/middleware.py' || true)
          if [ -n "$CHANGED" ] && ! echo "$PR_BODY" | grep -q "Approved-Governance-Change: yes"; then
            echo "::error::This PR changes governed files without 'Approved-Governance-Change: yes' in the PR body:%0A$CHANGED"
            exit 1
          fi

# Branch protection: add "No committed conflict markers", "ci.yml still contains every
# required job", and "Governing files untouched without approval marker" once green.
# "Env vars documented in .env.example" becomes required after scripts/check_env_parity.py lands.
