name: CI

on:
  push:
    branches: [staging, "feature/**"]
  pull_request:
    branches: [staging]

jobs:
  # ── Fast path: skip code checks for docs-only PRs ──────────────────────────
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      code-changed: ${{ steps.filter.outputs.code }}
      docs-only: ${{ steps.filter.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'api/**'
              - 'frontend/**'
              - 'scripts/**'
              - '.github/workflows/**'
              - 'docker-compose.yml'
            docs_only:
              - 'docs/**'

  # ── Backend ────────────────────────────────────────────────────────────────
  backend-lint:
    needs: detect-changes
    if: needs.detect-changes.outputs.code-changed == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - name: Install dependencies
        run: uv sync --dev
      - name: Lint with ruff
        run: uv run ruff check .
      - name: Format check with ruff
        run: uv run ruff format --check .
      - name: Type check with mypy
        run: uv run mypy app/ --ignore-missing-imports

  backend-tests:
    needs: detect-changes
    if: needs.detect-changes.outputs.code-changed == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - name: Install dependencies
        run: uv sync --dev
      - name: Run tests
        run: uv run pytest tests/ app/ --tb=short -q
      - name: Check test collection (must not error)
        run: uv run pytest --collect-only -q

  alembic-check:
    needs: detect-changes
    if: needs.detect-changes.outputs.code-changed == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: iqbalai
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: iqbalai
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - name: Install dependencies
        run: uv sync --dev
      - name: Create dual schemas
        run: |
          PGPASSWORD=ci_password psql -h localhost -U iqbalai -d iqbalai \
            -c "CREATE SCHEMA IF NOT EXISTS school; CREATE SCHEMA IF NOT EXISTS independent; GRANT ALL ON SCHEMA school TO iqbalai; GRANT ALL ON SCHEMA independent TO iqbalai;"
      - name: Run alembic upgrade heads
        env:
          DB_URL: postgresql+asyncpg://iqbalai:ci_password@localhost:5432/iqbalai
        run: uv run alembic upgrade heads

  # ── Frontend ───────────────────────────────────────────────────────────────
  frontend-lint:
    needs: detect-changes
    if: needs.detect-changes.outputs.code-changed == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm exec tsc --noEmit
      - name: Lint
        run: pnpm lint || true

  frontend-tests:
    needs: detect-changes
    if: needs.detect-changes.outputs.code-changed == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run tests
        run: pnpm test || true

  # ── Stack enforcement ───────────────────────────────────────────────────────
  stack-check:
    needs: detect-changes
    if: needs.detect-changes.outputs.code-changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run import checker
        run: python scripts/check_imports.py || true
      - name: Run stack lock checker
        run: python scripts/check_stack_lock.py || true
      - name: Run env vars checker
        run: python scripts/check_envvars.py || true

  # ── Docs-only fast path ─────────────────────────────────────────────────────
  docs-check:
    needs: detect-changes
    if: needs.detect-changes.outputs.docs-only == 'true' && needs.detect-changes.outputs.code-changed == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docs-only PR — skipping code checks
        run: echo "Docs-only PR detected. Code checks skipped per BRANCHING.md §8.1."
