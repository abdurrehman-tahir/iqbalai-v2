name: CI

on:
  push:
    branches: [staging, "feature/**"]
  pull_request:
    branches: [staging]

jobs:
  # ── Fast path: skip code checks for docs-only PRs ──────────────────────────
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      code-changed: ${{ steps.filter.outputs.code }}
      docs-only: ${{ steps.filter.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'api/**'
              - 'frontend/**'
              - 'scripts/**'
              - '.github/workflows/**'
              - 'docker-compose.yml'
            docs_only:
              - 'docs/**'

  # ── Backend ────────────────────────────────────────────────────────────────
  backend-lint:
    needs: detect-changes
    if: needs.detect-changes.outputs.code-changed == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - name: Install dependencies
        run: uv sync --dev
      - name: Lint with ruff
        run: uv run ruff check .
      - name: Format check with ruff
        run: uv run ruff format --check .
      - name: Type check with mypy
        run: uv run mypy app/ --ignore-missing-imports

  backend-tests:
    needs: detect-changes
    if: needs.detect-changes.outputs.code-changed == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - name: Install dependencies
        run: uv sync --dev
      - name: Run tests
        run: uv run pytest tests/ app/ --tb=short -q
      - name: Check test collection (must not error)
        run: uv run pytest --collect-only -q

  alembic-check:
    needs: detect-changes
    if: needs.detect-changes.outputs.code-changed == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: iqbalai
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: iqbalai
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - name: Install dependencies
        run: uv sync --dev
      - name: Create dual schemas
        run: |
          PGPASSWORD=ci_password psql -h localhost -U iqbalai -d iqbalai \
            -c "CREATE SCHEMA IF NOT EXISTS school; CREATE SCHEMA IF NOT EXISTS independent; GRANT ALL ON SCHEMA school TO iqbalai; GRANT ALL ON SCHEMA independent TO iqbalai;"
      - name: Run alembic upgrade heads
        env:
          DB_URL: postgresql+asyncpg://iqbalai:ci_password@localhost:5432/iqbalai
        run: uv run alembic upgrade heads

  # ── Frontend ───────────────────────────────────────────────────────────────
  frontend-lint:
    needs: detect-changes
    if: needs.detect-changes.outputs.code-changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect frontend
        id: detect
        run: |
          if [ -f frontend/package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "frontend/ not present yet — skipping frontend checks (pre-M-00)."
          fi

      - name: Install pnpm
        if: steps.detect.outputs.exists == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node 20
        if: steps.detect.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        if: steps.detect.outputs.exists == 'true'
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Type-check
        if: steps.detect.outputs.exists == 'true'
        working-directory: frontend
        run: pnpm typecheck

      - name: Lint
        if: steps.detect.outputs.exists == 'true'
        working-directory: frontend
        run: pnpm lint

      - name: Build
        if: steps.detect.outputs.exists == 'true'
        working-directory: frontend
        run: pnpm build

  frontend-tests:
    needs: detect-changes
    if: needs.detect-changes.outputs.code-changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Run tests
        working-directory: frontend
        run: pnpm test || true

  # ── Stack enforcement ───────────────────────────────────────────────────────
  stack-check:
    needs: detect-changes
    if: needs.detect-changes.outputs.code-changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required docs exist
        run: |
          set -e
          for f in docs/STACK_LOCK.md docs/BRANCHING.md docs/DEVIATIONS.md .claude/CLAUDE.md README.md; do
            if [ ! -f "$f" ]; then
              echo "❌ Missing required file: $f"
              exit 1
            fi
          done
          echo "✅ All required docs present."