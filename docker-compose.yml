networks:
  iqbalai_net:
    driver: bridge

volumes:
  pg_data:
  authentik_redis_data:
  authentik_media:
  authentik_certs:
  authentik_templates:
  redis_data:
  nats_data:
  minio_data:
  qdrant_data:
  infinity_models:
  celery_beat_data:
  prometheus_data:
  grafana_data:
  loki_data:

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    networks:
      - iqbalai_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  authentik-redis:
    image: redis:7-alpine
    mem_limit: 256m
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - authentik_redis_data:/data
    networks:
      - iqbalai_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  authentik-server:
    image: ghcr.io/goauthentik/server:2024.12
    mem_limit: 1g
    restart: unless-stopped
    command: server
    environment:
      AUTHENTIK_REDIS__HOST: authentik-redis
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_POSTGRESQL__USER: ${POSTGRES_USER}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${POSTGRES_PASSWORD}
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_BOOTSTRAP_EMAIL: ${AUTHENTIK_BOOTSTRAP_EMAIL}
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD}
      # T-247: consumed by Authentik at first init to mint an akadmin API token
      # with this exact value — so AUTHENTIK_API_TOKEN can equal it and the API +
      # seed scripts provision users with zero manual `ak shell` step (CI + local).
      AUTHENTIK_BOOTSTRAP_TOKEN: ${AUTHENTIK_BOOTSTRAP_TOKEN:-}
      # T-247: NOT read by Authentik itself (only AUTHENTIK_* is) — exposed so the
      # OIDC blueprint's `!Env` tags resolve the client id/secret + redirect URI to
      # the SAME values the API uses, keeping provider config and API config in sync.
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-iqbalai-api}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-change_me_after_authentik_bootstrap}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-http://localhost:8000/api/v1/auth/callback}
      OIDC_POST_LOGOUT_REDIRECT_URI: ${OIDC_POST_LOGOUT_REDIRECT_URI:-http://localhost:3000/login}
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      # SMTP for Authentik-sent mail (password recovery). Values from .env.
      # Port 465 = implicit SSL → USE_SSL=true / USE_TLS=false.
      AUTHENTIK_EMAIL__HOST: ${SMTP_HOST}
      AUTHENTIK_EMAIL__PORT: ${SMTP_PORT}
      AUTHENTIK_EMAIL__USERNAME: ${SMTP_USERNAME}
      AUTHENTIK_EMAIL__PASSWORD: ${SMTP_PASSWORD}
      AUTHENTIK_EMAIL__USE_SSL: ${SMTP_USE_SSL}
      AUTHENTIK_EMAIL__USE_TLS: ${SMTP_USE_TLS}
      AUTHENTIK_EMAIL__TIMEOUT: ${SMTP_TIMEOUT}
      AUTHENTIK_EMAIL__FROM: ${EMAIL_FROM}
    volumes:
      - authentik_media:/media
      - authentik_certs:/certs
      - authentik_templates:/templates
      # IqbalAI login/flow branding — restyles the PatternFly flow executor.
      # Loaded globally by authentik at /web/dist/custom.css (2024.12).
      - ./infrastructure/authentik/custom.css:/web/dist/custom.css:ro
      # IqbalAI logo — served at /static/dist/assets/icons/iqbal-logo.png.
      # Reference this path in System > Brands > Branding logo.
      - ./infrastructure/authentik/logo.png:/web/dist/assets/icons/iqbal-logo.png:ro
      # Login flow background. Flow DB points at flow-backgrounds/iqbalai-login-bg.png
      # (set in admin); bind-mount the repo art over that exact path so redesigns
      # show up without re-uploading. Also keep /media/branding/ for CSS fallback.
      # Mounting a single FILE (not the directory) keeps other public uploads writable.
      - ./infrastructure/authentik/login-bg.png:/media/public/flow-backgrounds/iqbalai-login-bg.png:ro
      - ./infrastructure/authentik/login-bg.png:/media/branding/login-bg.png:ro
      # T-247: OIDC provider + application blueprint. Authentik auto-discovers and
      # applies everything under /blueprints on boot (idempotent), so the OIDC app
      # self-provisions in a fresh container — no manual setup / stub script.
      - ./infrastructure/authentik/blueprints:/blueprints/iqbalai:ro
    ports:
      - "9000:9000"
      - "9443:9443"
    networks:
      - iqbalai_net
    depends_on:
      postgres:
        condition: service_healthy
      authentik-redis:
        condition: service_healthy
    healthcheck:
      # First boot runs migrations + worker init (~90s on Docker Desktop).
      test: ["CMD-SHELL", "ak healthcheck || exit 1"]
      interval: 30s
      timeout: 30s
      retries: 10
      start_period: 120s

  authentik-worker:
    image: ghcr.io/goauthentik/server:2024.12
    mem_limit: 512m
    restart: unless-stopped
    command: worker
    environment:
      AUTHENTIK_REDIS__HOST: authentik-redis
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_POSTGRESQL__USER: ${POSTGRES_USER}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${POSTGRES_PASSWORD}
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      # T-247: the worker runs blueprint-apply tasks — same bootstrap token +
      # OIDC `!Env` inputs as the server so the applied provider matches API config.
      AUTHENTIK_BOOTSTRAP_TOKEN: ${AUTHENTIK_BOOTSTRAP_TOKEN:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-iqbalai-api}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-change_me_after_authentik_bootstrap}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-http://localhost:8000/api/v1/auth/callback}
      OIDC_POST_LOGOUT_REDIRECT_URI: ${OIDC_POST_LOGOUT_REDIRECT_URI:-http://localhost:3000/login}
      # The worker sends the mail — it needs the same SMTP config as the server.
      AUTHENTIK_EMAIL__HOST: ${SMTP_HOST}
      AUTHENTIK_EMAIL__PORT: ${SMTP_PORT}
      AUTHENTIK_EMAIL__USERNAME: ${SMTP_USERNAME}
      AUTHENTIK_EMAIL__PASSWORD: ${SMTP_PASSWORD}
      AUTHENTIK_EMAIL__USE_SSL: ${SMTP_USE_SSL}
      AUTHENTIK_EMAIL__USE_TLS: ${SMTP_USE_TLS}
      AUTHENTIK_EMAIL__TIMEOUT: ${SMTP_TIMEOUT}
      AUTHENTIK_EMAIL__FROM: ${EMAIL_FROM}
    volumes:
      - authentik_media:/media
      - authentik_certs:/certs
      - authentik_templates:/templates
      # T-247: the worker applies blueprints — mount the same OIDC blueprint dir.
      - ./infrastructure/authentik/blueprints:/blueprints/iqbalai:ro
    networks:
      - iqbalai_net
    depends_on:
      authentik-server:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - iqbalai_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nats:
    profiles: ["events"]
    image: nats:2.10-alpine
    restart: unless-stopped
    command: ["-js", "-sd", "/data", "--http_port", "8222"]
    volumes:
      - nats_data:/data
    ports:
      - "4222:4222"
      - "8222:8222"
    networks:
      - iqbalai_net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8222/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    profiles: ["rag"]
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "9001:9001"
    networks:
      - iqbalai_net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Web search for RAG tier-3 + exam-framework Pattern-A research (ARCH §7.12 / T-093).
  # JSON output is enabled in infrastructure/searxng/settings.yml (required by web_search).
  searxng:
    profiles: ["rag"]
    image: searxng/searxng:latest
    restart: unless-stopped
    environment:
      SEARXNG_BASE_URL: ${SEARXNG_BASE_URL:-http://localhost:8888/}
      # Avoid ownership churn on the bind-mounted settings.yml (Windows/WSL hosts).
      FORCE_OWNERSHIP: "false"
    volumes:
      - ./infrastructure/searxng:/etc/searxng:rw
    ports:
      # Host 8888 matches api/app/config.py default for non-Docker API runs.
      - "8888:8080"
    networks:
      - iqbalai_net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - 'http://localhost:8080/search?q=iqbalai&format=json' | grep -q '\"results\"' || exit 1",
        ]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s

  qdrant:
    profiles: ["rag"]
    image: qdrant/qdrant:latest
    mem_limit: 1g
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
      - "6334:6334"
    networks:
      - iqbalai_net
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  infinity:
    profiles: ["rag"]
    # Pin a multi-arch tag — `latest` is amd64-only and breaks on Apple Silicon (Rosetta crash-loop).
    image: michaelf34/infinity:0.0.75
    mem_limit: 4g
    restart: unless-stopped
    # Reranker omitted locally — halves RAM (~2 GB). Re-add bge-reranker-v2-m3 for full RAG retrieval.
    command: >
      v2
      --model-id BAAI/bge-m3
      --port 7997
      --engine optimum
    volumes:
      - infinity_models:/app/.cache
    ports:
      - "7997:7997"
    networks:
      - iqbalai_net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:7997/health || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 300s

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DB_URL: ${DB_URL}
      REDIS_URL: ${REDIS_URL}
      NATS_URL: ${NATS_URL}
      EVENTS_ENABLED: ${EVENTS_ENABLED:-false}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      QDRANT_URL: ${QDRANT_URL}
      # Container DNS name — do not use localhost here (that is the API container itself).
      WEBSEARCH_URL: ${WEBSEARCH_URL:-http://searxng:8080}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-http://authentik-server:9000/application/o/iqbalai/}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-http://authentik-server:9000/application/o/iqbalai/jwks/}
      # Browser hits AUTHORIZE on localhost:9000; API container hits TOKEN/REVOKE
      # on authentik-server (localhost inside the API container is not Authentik).
      OIDC_AUTHORIZE_URL: ${OIDC_AUTHORIZE_URL:-http://localhost:9000/application/o/authorize/}
      OIDC_TOKEN_URL: ${OIDC_TOKEN_URL:-http://authentik-server:9000/application/o/token/}
      OIDC_REVOKE_URL: ${OIDC_REVOKE_URL:-http://authentik-server:9000/application/o/revoke/}
      AUTHENTIK_API_URL: ${AUTHENTIK_API_URL:-http://authentik-server:9000/api/v3}
      AUTHENTIK_API_TOKEN: ${AUTHENTIK_API_TOKEN:-}
      LLM_PROVIDER: ${LLM_PROVIDER}
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL}
      LLM_FALLBACK_PROVIDER: ${LLM_FALLBACK_PROVIDER:-openai}
      LLM_FALLBACK_BASE_URL: ${LLM_FALLBACK_BASE_URL:-}
      LLM_FALLBACK_API_KEY: ${LLM_FALLBACK_API_KEY:-}
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-gpt-4o-mini}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_VECTOR_DIM: ${EMBEDDING_VECTOR_DIM:-0}
      INFINITY_URL: ${INFINITY_URL:-http://infinity:7997}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      APP_URL: ${APP_URL:-http://localhost:3000}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-log}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@iqbalai.local}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-true}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-false}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_TIMEOUT: ${SMTP_TIMEOUT:-30}
    volumes:
      - ./api:/app
    ports:
      - "8000:8000"
    networks:
      - iqbalai_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/app
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')\" || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 90s

  celery-worker:
    profiles: ["workers"]
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A app.tasks.celery_app worker --loglevel=info --queues=default,ingestion,ml,notifications
    environment:
      DB_URL: ${DB_URL}
      REDIS_URL: ${REDIS_URL}
      NATS_URL: ${NATS_URL}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      QDRANT_URL: ${QDRANT_URL}
      WEBSEARCH_URL: ${WEBSEARCH_URL:-http://searxng:8080}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_VECTOR_DIM: ${EMBEDDING_VECTOR_DIM:-0}
      INFINITY_URL: ${INFINITY_URL:-http://infinity:7997}
      LLM_PROVIDER: ${LLM_PROVIDER}
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL}
    volumes:
      - ./api:/app
    networks:
      - iqbalai_net
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  celery-beat:
    profiles: ["workers"]
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    command: >
      celery -A app.tasks.celery_app beat --loglevel=info
      --scheduler celery.beat.PersistentScheduler
      --schedule /home/app/celerybeat/celerybeat-schedule
    environment:
      DB_URL: ${DB_URL}
      REDIS_URL: ${REDIS_URL}
    volumes:
      - ./api:/app
      - celery_beat_data:/home/app/celerybeat
    networks:
      - iqbalai_net
    depends_on:
      redis:
        condition: service_healthy

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    networks:
      - iqbalai_net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3001:3000"
    networks:
      - iqbalai_net
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  loki:
    profiles: ["observability"]
    image: grafana/loki:3.4.2
    restart: unless-stopped
    command: -config.file=/etc/loki/config.yaml -target=all
    volumes:
      - loki_data:/loki
      - ./infrastructure/loki/config.yaml:/etc/loki/config.yaml:ro
    ports:
      - "3100:3100"
    networks:
      - iqbalai_net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
      NEXT_PUBLIC_AUTHENTIK_URL: ${NEXT_PUBLIC_AUTHENTIK_URL:-http://localhost:9000}
      NEXT_PUBLIC_AUTHENTIK_CLIENT_ID: ${NEXT_PUBLIC_AUTHENTIK_CLIENT_ID:-iqbalai-frontend}
      # Docker Desktop on macOS: reliable file watching for bind-mounted source
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    networks:
      - iqbalai_net
    depends_on:
      - api
    # Dev server compiles on first request; HTTP healthchecks pile up wget processes
    # and starve Next.js. Process check is enough for local compose.
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'next-server' >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
